name: Symfony CI Pipeline

on:
  push:
    branches: [ ci ]
  pull_request:
    branches: [ ci ]

jobs:
  symfony-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'  # Adapter si nécessaire
          extensions: mbstring, intl, pdo_pgsql
          tools: symfony, phpstan, phpunit

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: "${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}"
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Build
        run: |
          docker compose -f "docker-compose.yml" up -d --build
          composer install
          php bin/console doctrine:database:drop -f --if-exists --env=test
          php bin/console doctrine:database:create --env=test
          php bin/console doctrine:migrations:migrate -n --env=test
          php bin/console doctrine:fixtures:load -n --purge-with-truncate --group=test --env=test
          php bin/console sass:build
      - name: Tests
        run: php bin/phpunit
      - name: Analysis
        run: php vendor/bin/phpstan